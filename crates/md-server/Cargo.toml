[package]
name = "md-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
md-core.workspace = true
aho-corasick.workspace = true
axum.workspace = true
http-body.workspace = true
base64.workspace = true
blake3.workspace = true
getrandom.workspace = true
rmcp = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url.workspace = true
# `process` + `time` drive the commit hook and git automation (ADR-0017/0018);
# `sync` is the hook queue channel.
tokio = { workspace = true, features = ["process", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Client side for the in-process e2e test; the reqwest streamable-http client +
# `tokio` time drive the HTTP transport e2e test (ADR-0013).
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["time"] }
# Raw HTTP client to drive the OAuth endpoints in the e2e test (ADR-0014).
reqwest = { version = "0.13", default-features = false, features = ["json", "form"] }
