[package]
name = "md-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
md-core.workspace = true
aho-corasick.workspace = true
axum.workspace = true
blake3.workspace = true
rmcp = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Client side for the in-process e2e test; the reqwest streamable-http client +
# `tokio` time drive the HTTP transport e2e test (ADR-0013).
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["time"] }
